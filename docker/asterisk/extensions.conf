[general]
static = yes
writeprotect = no

[from-internal]
; Ichki raqamlar -> ARI ilovasi (backend) ulaydi
exten => _X.,1,NoOp(Qo'ng'iroq: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(sip_app,dial,${EXTEN})
 same => n,Hangup()

; Demo: telefonsiz sinash uchun javob beradigan avtomat.
; backend/.env da SIP_DIAL_TEMPLATE=Local/{number}@demo-answer qilib qo'ying.
[demo-answer]
exten => _X.,1,NoOp(Demo abonent: ${EXTEN})
 same => n,Answer()
 same => n,Wait(120)
 same => n,Hangup()
