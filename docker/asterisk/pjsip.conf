[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- Shablonlar ----
[endpoint-template](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes

; ---- 1001 ----
[1001](endpoint-template)
auth = 1001
aors = 1001
callerid = "User 1001" <1001>

[1001](auth-template)
username = 1001
password = pass1001

[1001](aor-template)

; ---- 1002 ----
[1002](endpoint-template)
auth = 1002
aors = 1002
callerid = "User 1002" <1002>

[1002](auth-template)
username = 1002
password = pass1002

[1002](aor-template)
