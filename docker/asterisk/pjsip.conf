[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- Shablonlar ----
[endpoint-template](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes

; ---- SIP hisoblar ----
; Saytdagi "SIP hisoblar" sahifasi shu faylni avtomatik yozadi (umumiy volume).
