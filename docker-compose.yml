services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip"]
      interval: 5s
      timeout: 3s
      retries: 10

  asterisk:
    image: andrius/asterisk:20
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./docker/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./docker/asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./docker/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./docker/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      # Backend yuklagan audio (ijro uchun) va Asterisk yozgan suhbatlar — umumiy volume'lar
      - sounds:/var/lib/asterisk/sounds/custom
      - recordings:/var/spool/asterisk/recording

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - sounds:/data/sounds
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8001/api/v1
      VITE_WS_URL: ws://localhost:8001/api/v1/ws/events
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  sounds:
  recordings:
